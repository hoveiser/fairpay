<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7ee"/>
      <stop offset="1" stop-color="#efe8d8"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14564a"/>
      <stop offset="1" stop-color="#0b2e27"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0e9f6e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd25e"/>
      <stop offset="1" stop-color="#f0a417"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- GenLayer mark as the scale stand -->
  <g transform="translate(256 270) scale(0.6) translate(-250 -291)">
    <polygon points="230,108 230,240 165,375 228,408 55,475" fill="url(#dark)"/>
    <polygon points="268,108 268,240 333,375 272,408 445,475" fill="url(#green)"/>
    <polygon points="248,283 212,358 248,378 287,358" fill="url(#dark)"/>
  </g>

  <!-- beam and pivot -->
  <rect x="84" y="148" width="344" height="14" rx="7" fill="#0b2e27"/>
  <circle cx="256" cy="155" r="17" fill="url(#gold)" stroke="#fbf7ee" stroke-width="5"/>

  <!-- left pan: coins (the pay) -->
  <g transform="translate(96 270)">
    <line x1="0" y1="-108" x2="-54" y2="-2" stroke="#0b2e27" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="-108" x2="54" y2="-2" stroke="#0b2e27" stroke-width="5" stroke-linecap="round"/>
    <path d="M-62 -2 H62 Q50 46 0 46 Q-50 46 -62 -2 Z" fill="url(#dark)"/>
    <g fill="url(#gold)" stroke="#b97a0a" stroke-width="3">
      <ellipse cx="0" cy="-12" rx="32" ry="10"/>
      <ellipse cx="0" cy="-26" rx="32" ry="10"/>
      <ellipse cx="0" cy="-40" rx="32" ry="10"/>
    </g>
  </g>

  <!-- right pan: verified quality work -->
  <g transform="translate(416 270)">
    <line x1="0" y1="-108" x2="-54" y2="-2" stroke="#0b2e27" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="-108" x2="54" y2="-2" stroke="#0b2e27" stroke-width="5" stroke-linecap="round"/>
    <path d="M-62 -2 H62 Q50 46 0 46 Q-50 46 -62 -2 Z" fill="url(#dark)"/>
    <circle cx="0" cy="-36" r="34" fill="url(#green)" stroke="#fbf7ee" stroke-width="4"/>
    <path d="M-16 -35 L-4 -23 L18 -49" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

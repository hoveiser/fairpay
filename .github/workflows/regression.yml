name: regression

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pytest genlayer-test genvm-linter
      - name: Seed Direct Mode runner cache
        # gltest downloads the unversioned genvm-universal.tar.xz asset, which
        # recent releases renamed to genvm-runners-all.tar.xz (404 on a clean
        # runner). Seed gltest's cache from genvm-lint's correctly-fetched
        # bundle so Direct Mode tests run without a cache-dependent shortcut.
        run: bash scripts/setup_direct_test_cache.sh contracts/contract.py
      - name: Run regression harness
        run: |
          pytest tests/ -v --junitxml=tests.xml
          passed=$(python -c "import xml.etree.ElementTree as E;t=E.parse('tests.xml').getroot().find('testsuite');print(int(t.get('tests'))-int(t.get('errors'))-int(t.get('failures')))")
          total=$(python -c "import xml.etree.ElementTree as E;print(E.parse('tests.xml').getroot().find('testsuite').get('tests'))")
          echo "Direct Mode + unit result: $passed/$total passed" | tee -a "$GITHUB_STEP_SUMMARY"